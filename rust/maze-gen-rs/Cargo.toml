[package]
name = "maze-gen-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "PyO3 bindings for rectangular and triangular maze generation (Kruskal, Prim, DFS)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
rayon = "1"
mimalloc = "0.1"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
